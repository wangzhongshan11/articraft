schema_version: "articraft-complex-3dprint-case.v1"
case_id: "06_foldable_chair_model"
title_zh: "折叠椅结构模型（非承载）"
title_en: "Folding chair structural model (non-load-bearing)"
benchmark_tier: "complex_articulated_3d_print"
objective: "Generate a complete tabletop-scale articulated printable model with semantic parts, URDF joints, source, printable mesh exports, and provenance evidence."
safety_scope: "Desktop-scale non-safety-critical demonstrator only; not for real flight, cutting, heating, adult/child load bearing or medical use."
input:
  language: "zh"
  prompt_file: "prompt_zh.md"
  optional_reference_policy: "Reference images may be used only if their provenance is recorded."
kinematics:
  required_joints:
    -
      name: "front_cross"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 80.0
    -
      name: "rear_cross"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 80.0
    -
      name: "seat_link_left"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 80.0
    -
      name: "seat_link_right"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 80.0
  motion_probe_states:
    - "rest"
    - "mid"
    - "limit"
  must_be_collision_checked: true
deliverables:
  required:
    - "model.py"
    - "model.urdf"
    - "part_manifest.json"
    - "joint_manifest.json"
    - "events.jsonl"
    - "artifact_manifest.json"
    - "run_metadata.json"
    - "metrics.json"
  preferred:
    - "model.step"
    - "model.3mf"
    - "preview.png"
    - "orthographic_views"
    - "motion_probe_images"
  print_mesh:
    - "STL or 3MF per printable part"
  min_semantic_parts: 6
manufacturing:
  fdm_profile: "../../config/fdm_baseline.json"
  required_checks:
    - "three_pose_collision_probe"
    - "non_loadbearing_label"
    - "rod_thickness_ge_4mm"
    - "pivot_alignment"
evaluation_focus:
  - "scissor linkage"
  - "coaxial pivots"
  - "folded-volume constraint"
  - "pose tests"
  - "safe use labeling"
scoring:
  kinematics: 30
  part_semantics: 15
  printability: 25
  artifact_completeness: 15
  traceability: 15
