schema_version: "articraft-complex-3dprint-case.v1"
case_id: "09_mini_stationary_bike"
title_zh: "微型健身车传动演示模型"
title_en: "Mini stationary exercise-bike drivetrain demonstrator"
benchmark_tier: "complex_articulated_3d_print"
objective: "Generate a complete tabletop-scale articulated printable model with semantic parts, URDF joints, source, printable mesh exports, and provenance evidence."
safety_scope: "Desktop-scale non-safety-critical demonstrator only; not for real flight, cutting, heating, adult/child load bearing or medical use."
input:
  language: "zh"
  prompt_file: "prompt_zh.md"
  optional_reference_policy: "Reference images may be used only if their provenance is recorded."
kinematics:
  required_joints:
    -
      name: "crank"
      type: "continuous"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - -360.0
        - 360.0
    -
      name: "flywheel"
      type: "continuous"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - -360.0
        - 360.0
    -
      name: "seat_post"
      type: "prismatic"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 25.0
  motion_probe_states:
    - "rest"
    - "mid"
    - "limit"
  must_be_collision_checked: true
deliverables:
  required:
    - "model.py"
    - "model.urdf"
    - "part_manifest.json"
    - "joint_manifest.json"
    - "events.jsonl"
    - "artifact_manifest.json"
    - "run_metadata.json"
    - "metrics.json"
  preferred:
    - "model.step"
    - "model.3mf"
    - "preview.png"
    - "orthographic_views"
    - "motion_probe_images"
  print_mesh:
    - "STL or 3MF per printable part"
  min_semantic_parts: 9
manufacturing:
  fdm_profile: "../../config/fdm_baseline.json"
  required_checks:
    - "parallel_axle_probe"
    - "crank_clearance"
    - "seat_slider_travel"
    - "small_feature_ge_1.2mm"
evaluation_focus:
  - "rotational transmission layout"
  - "mixed joint types"
  - "parallel-axis accuracy"
  - "repeated pedals"
  - "printable assembly"
scoring:
  kinematics: 30
  part_semantics: 15
  printability: 25
  artifact_completeness: 15
  traceability: 15
