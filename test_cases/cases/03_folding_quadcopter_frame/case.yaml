schema_version: "articraft-complex-3dprint-case.v1"
case_id: "03_folding_quadcopter_frame"
title_zh: "折叠式四旋翼无人机机架（无电子件）"
title_en: "Folding quadcopter frame (electronics-free)"
benchmark_tier: "complex_articulated_3d_print"
objective: "Generate a complete tabletop-scale articulated printable model with semantic parts, URDF joints, source, printable mesh exports, and provenance evidence."
safety_scope: "Desktop-scale non-safety-critical demonstrator only; not for real flight, cutting, heating, adult/child load bearing or medical use."
input:
  language: "zh"
  prompt_file: "prompt_zh.md"
  optional_reference_policy: "Reference images may be used only if their provenance is recorded."
kinematics:
  required_joints:
    -
      name: "arm_fl"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 95.0
    -
      name: "arm_fr"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 95.0
    -
      name: "arm_rl"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 95.0
    -
      name: "arm_rr"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 95.0
  motion_probe_states:
    - "rest"
    - "mid"
    - "limit"
  must_be_collision_checked: true
deliverables:
  required:
    - "model.py"
    - "model.urdf"
    - "part_manifest.json"
    - "joint_manifest.json"
    - "events.jsonl"
    - "artifact_manifest.json"
    - "run_metadata.json"
    - "metrics.json"
  preferred:
    - "model.step"
    - "model.3mf"
    - "preview.png"
    - "orthographic_views"
    - "motion_probe_images"
  print_mesh:
    - "STL or 3MF per printable part"
  min_semantic_parts: 5
manufacturing:
  fdm_profile: "../../config/fdm_baseline.json"
  required_checks:
    - "fourfold_symmetry"
    - "arm_collision_probe"
    - "latch_min_feature_ge_1.6mm"
    - "separate_arm_parts"
evaluation_focus:
  - "circular symmetry"
  - "repeated joints"
  - "folded/open states"
  - "locking geometry"
  - "assembly completeness"
scoring:
  kinematics: 30
  part_semantics: 15
  printability: 25
  artifact_completeness: 15
  traceability: 15
