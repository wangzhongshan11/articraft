schema_version: "articraft-complex-3dprint-case.v1"
case_id: "10_hinged_waffle_press"
title_zh: "铰接式压板/华夫饼机外观机构模型（无加热）"
title_en: "Hinged press / waffle-maker mechanism model (unheated)"
benchmark_tier: "complex_articulated_3d_print"
objective: "Generate a complete tabletop-scale articulated printable model with semantic parts, URDF joints, source, printable mesh exports, and provenance evidence."
safety_scope: "Desktop-scale non-safety-critical demonstrator only; not for real flight, cutting, heating, adult/child load bearing or medical use."
input:
  language: "zh"
  prompt_file: "prompt_zh.md"
  optional_reference_policy: "Reference images may be used only if their provenance is recorded."
kinematics:
  required_joints:
    -
      name: "lid_left_hinge"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 105.0
    -
      name: "lid_right_hinge"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 105.0
    -
      name: "front_latch"
      type: "revolute"
      parent: "<declare_in_output>"
      child: "<declare_in_output>"
      axis: "<declare_in_output>"
      limit_deg:
        - 0.0
        - 35.0
  motion_probe_states:
    - "rest"
    - "mid"
    - "limit"
  must_be_collision_checked: true
deliverables:
  required:
    - "model.py"
    - "model.urdf"
    - "part_manifest.json"
    - "joint_manifest.json"
    - "events.jsonl"
    - "artifact_manifest.json"
    - "run_metadata.json"
    - "metrics.json"
  preferred:
    - "model.step"
    - "model.3mf"
    - "preview.png"
    - "orthographic_views"
    - "motion_probe_images"
  print_mesh:
    - "STL or 3MF per printable part"
  min_semantic_parts: 6
manufacturing:
  fdm_profile: "../../config/fdm_baseline.json"
  required_checks:
    - "grid_array"
    - "open_close_collision_probe"
    - "plate_clearance_ge_1mm"
    - "shell_wall_ge_2mm"
evaluation_focus:
  - "hinged enclosure"
  - "latch semantics"
  - "pattern array"
  - "motion limits"
  - "separable plates"
scoring:
  kinematics: 30
  part_semantics: 15
  printability: 25
  artifact_completeness: 15
  traceability: 15
